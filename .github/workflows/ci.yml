name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run every bundled suite with the offline replay agent
        run: python3 -m arcturion_evals --state-dir "$RUNNER_TEMP/evals-state" --agent-cmd "python3 examples/replay_agent.py" run --slice 100
